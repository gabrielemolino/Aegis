name: SentinelAI CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test on macOS (Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Swift Version
        run: swift --version

      - name: Build SentinelAI
        run: swift build -v

      - name: Run Swift Unit & Security Policy Tests
        run: swift test -v

      - name: Run Guest Telemetry Sensor Tests (Python 3)
        run: python3 guest-sensor/test_sensor.py -v
