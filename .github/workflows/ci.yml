name: Aegis CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test on macOS (Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6)
        run: |
          for app in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$app/Contents/Developer" ]; then
              echo "Selecting Xcode: $app"
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Build Aegis
        run: swift build -v

      - name: Run Swift Unit & Security Policy Tests (50 Tests)
        run: swift test -v

      - name: Run Guest Telemetry Sensor Tests (Python 3)
        run: python3 guest-sensor/test_sensor.py -v

      - name: Verify Packaging Script (.app, .dmg, .zip)
        run: |
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh
